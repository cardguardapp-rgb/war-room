<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline — War Room</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #1f3864; color: #f5f3ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 24px; box-sizing: border-box; text-align: center;
      }
      .card { max-width: 22rem; }
      .mark {
        width: 72px; height: 72px; margin: 0 auto 20px;
        border-radius: 20px; background: rgba(245,243,238,0.12);
        display: flex; align-items: center; justify-content: center;
      }
      .mark svg { width: 40px; height: 40px; fill: #f5f3ee; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { margin: 0 0 24px; line-height: 1.5; color: rgba(245,243,238,0.8); }
      button {
        background: #f5f3ee; color: #1f3864; border: 0;
        padding: 12px 24px; min-height: 44px; border-radius: 12px;
        font-size: 1rem; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M10 4h4a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2Zm0 3h4V6h-4v1Z"/></svg>
      </div>
      <h1>You're offline</h1>
      <p>War Room needs a connection to load your jobs, resume and documents. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
